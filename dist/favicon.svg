<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b48" />
      <stop offset="100%" stop-color="#071526" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Crest Shield Background -->
  <path d="M32 4 C48 4 58 12 58 26 C58 44 32 60 32 60 C32 60 6 44 6 26 C6 12 16 4 32 4 Z" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />

  <!-- Inner Gold Trim -->
