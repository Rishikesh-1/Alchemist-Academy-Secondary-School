  <!-- Academic Cap / Mortarboard Icon in Center -->
  <polygon points="32,18 50,26 32,34 14,26" fill="url(#goldGrad)" />
  <path d="M22,30.5 L22,39 C22,43 42,43 42,39 L42,30.5" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M48,27 L48,37 L45,39" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round" />
  <circle cx="45" cy="40" r="1.5" fill="#f59e0b" />

  <!-- Sparkle Stars -->
  <circle cx="32" cy="45" r="1.8" fill="#fbbf24" />
</svg>

